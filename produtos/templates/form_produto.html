{% extends 'base.html' %}

{% block title %}
    {{ 'Editar' if produto else 'Novo' }} Produto — MiniStore
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if produto else 'Novo' }} Produto</h1>
</div>

{% if produto %}
<form action="{{ url_for('produtos.editar', id=produto.id) }}" method="POST">
{% else %}
<form action="{{ url_for('produtos.novo') }}" method="POST">
{% endif %}

    <div class="form-group">
        <label for="codigo">Código *</label>
        <input type="text" id="codigo" name="codigo"
               class="form-control"
               value="{{ produto.codigo if produto else '' }}"
               required>
    </div>

    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome"
               class="form-control"
               value="{{ produto.nome if produto else '' }}"
               required>
    </div>

    <div class="form-group">
        <label for="id_categoria">Categoria</label>
        <select id="id_categoria" name="id_categoria" class="form-control">
            <option value="">Selecione uma categoria</option>
            {% for cat in categorias %}
                <option value="{{ cat.id }}" {% if produto and produto.id_categoria == cat.id %}selected{% endif %}>
                    {{ cat.nome }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="preco">Preço (R$) *</label>
        <input type="number" step="0.01" min="0" id="preco" name="preco"
               class="form-control"
               value="{{ "%.2f"|format(produto.preco) if produto else '' }}"
               required>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" class="form-control" rows="3">{{ produto.descricao|default('') if produto else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            {{ 'Salvar' if produto else 'Cadastrar' }}
        </button>
        <a href="{{ url_for('produtos.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>

</form>
{% endblock %}
